[project]
name = "teams-agent-adapter"
version = "1.0.0"
description = "Microsoft Teams integration backend for Workspace Agents"
authors = [
    { name = "Transformación Digital y TI" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "python-dotenv>=1.0.0",
    "microsoft-teams-apps",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "fastapi>=0.115.0",
    "azure-identity>=1.17.0",
    "azure-data-tables>=12.5.0",
    "aiohttp>=3.10.0"
]

[dependency-groups]
dev = [
    "pyright>=1.1.406"
]

[project.scripts]
start = "src.main:main"
typecheck = "pyright.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]